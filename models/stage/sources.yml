version: 2

sources:

    - name: src
      database: JAFFLE_SHOP
      schema: JSHOP
      tables:

          - name: items
            description: staging layer for items data
          - name: orders
            description: staging layer for orders data
          - name: nations
            description: staging layer for nations data
        
          - name: customers
            description: staging layer for customers data

          - name: products
            description: staging layer for products data

            config:
            freshness:
                warn_after: {count:24 period: hour}
                error_after: {count:48 period: hour}
                loaded_at_field: o_orderdate :: timestamp